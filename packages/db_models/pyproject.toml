[project]
name = "projectplant-db-models"
version = "0.1.0"
description = "Persistence models and migrations for ProjectPlant"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
