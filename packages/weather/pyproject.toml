[project]
name = "projectplant-weather"
version = "0.1.0"
description = "Weather adapters and cache orchestration for ProjectPlant"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
